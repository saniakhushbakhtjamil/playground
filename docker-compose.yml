services:
  jobhunt:
    build:
      context: ./apps/jobhunt
      dockerfile: Dockerfile
    volumes:
      # Server resolves its data dir relative to dist → /app/server/data
      - jobhunt-data:/app/server/data
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.naukri.rule=Host(`naukri.almari`)
      - traefik.http.routers.naukri.entrypoints=websecure
      - traefik.http.routers.naukri.tls=true
      - traefik.http.services.naukri.loadbalancer.server.port=3001
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/usr/share/nginx/html/portfolio:ro
    restart: unless-stopped

  nginx-staging:
    image: nginx:alpine
    volumes:
      - ./nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - ../staging:/usr/share/nginx/html/staging:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
      - nginx-staging
    restart: unless-stopped

volumes:
  jobhunt-data:

networks:
  traefik-public:
    external: true
