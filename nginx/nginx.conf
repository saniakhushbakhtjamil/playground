events {}

http {
  include mime.types;

  # Rate limit for the public access-request endpoint (5 req/min per IP)
  limit_req_zone $binary_remote_addr zone=accessreq:1m rate=5r/m;

  server {
    listen 80;
    listen [::]:80;
    server_name saniajamil.com www.saniajamil.com;

    root /usr/share/nginx/html/portfolio;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Public access-request submissions → jobhunt server.
    # ONLY this exact path, POST-only, rate-limited — the jobhunt API is
    # otherwise unauthenticated and must not be exposed more broadly.
    location = /api/access-requests {
      limit_req zone=accessreq burst=3 nodelay;
      limit_except POST { deny all; }
      resolver 127.0.0.11 valid=10s;
      set $jobhunt http://jobhunt:3001;
      proxy_pass $jobhunt;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /\. {
      deny all;
    }

    location ~* \.(json|yml|yaml|env|config|py|sh|sql)$ {
      deny all;
    }
  }

}
