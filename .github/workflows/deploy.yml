name: Deploy to server

on:
  push:
    branches:
      - main
  # Pushes made by the weekly resume-sync job use GITHUB_TOKEN, which does not
  # re-trigger `push` workflows. Fire deploy when that workflow completes so the
  # refreshed resume.pdf still gets published.
  workflow_run:
    workflows: ["Sync resume from Google Doc"]
    types:
      - completed

jobs:
  deploy:
    # On direct pushes always; on the sync chain only if the sync succeeded.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    defaults:
      run:
        working-directory: C:\Users\Hello\home_server\playground

    steps:
      - name: Pull latest changes
        run: git pull origin main

      - name: Restart nginx (if config changed)
        run: |
          $changed = git diff HEAD~1 --name-only
          if ($changed -match "nginx/nginx.conf") {
            docker compose restart nginx
            Write-Host "nginx.conf changed — restarted nginx"
          } else {
            Write-Host "No nginx config change — skipping restart"
          }

      - name: Recreate containers (if docker-compose changed)
        run: |
          $changed = git diff HEAD~1 --name-only
          if ($changed -match "docker-compose.yml") {
            docker compose up -d
            Write-Host "docker-compose.yml changed — recreated containers"
          } else {
            Write-Host "No compose change — skipping"
          }
